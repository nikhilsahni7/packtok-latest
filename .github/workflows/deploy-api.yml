# Required GitHub secrets:
# VPS_HOST, VPS_USER, VPS_SSH_PRIVATE_KEY, VPS_PORT

name: Deploy API

on:
  push:
    branches:
      - main
    paths:
      - "apps/api/**"
      - "packages/db/**"
      - "packages/utils/**"
      - "pnpm-lock.yaml"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

concurrency:
  group: deploy-api-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/nikhilsahni7/packtok-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ env.IMAGE_NAME }}
      sha_tag: ${{ steps.vars.outputs.sha_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        id: vars
        run: echo "sha_tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.sha_tag }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -euo pipefail

            IMAGE="${{ needs.build-and-push.outputs.image }}"
            GIT_SHA="${{ needs.build-and-push.outputs.sha_tag }}"
            COMPOSE_DIR="/home/ubuntu/packtok"

            cd "$COMPOSE_DIR"

            # Capture previous image ID for rollback
            PREV_IMAGE="$(docker compose images -q api 2>/dev/null || true)"

            # Run Prisma migrations before swapping the container
            docker run --rm \
              --env-file ./apps/api/.env.production \
              "${IMAGE}:${GIT_SHA}" \
              node node_modules/prisma/build/index.js migrate deploy --schema=./prisma/schema.prisma

            # Pull new image and start
            docker compose pull api
            docker compose up -d --no-build --remove-orphans

            # Health-check retry loop (up to 60 seconds)
            echo "⏳ Waiting for health check…"
            for i in $(seq 1 20); do
              if curl -fsS http://127.0.0.1:3001/api/v1/healthcheck >/dev/null 2>&1; then
                echo "✅ Health check passed on attempt $i"
                break
              fi
              if [ "$i" -eq 20 ]; then
                echo "❌ Health check failed after 20 attempts — rolling back"
                if [ -n "$PREV_IMAGE" ]; then
                  docker tag "$PREV_IMAGE" "${IMAGE}:latest"
                  docker compose up -d --no-build
                  sleep 10
                fi
                docker compose logs --tail=100 api
                exit 1
              fi
              sleep 3
            done

            # Cleanup dangling and old images to free disk
            docker image prune -f --filter "until=168h" >/dev/null 2>&1 || true

            docker compose logs --tail=20 api
