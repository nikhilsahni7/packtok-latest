services:
  api:
    # IMAGE_TAG is set by CI to the commit SHA; `latest` is only a local fallback.
    image: ghcr.io/nikhilsahni7/packtok-api:${IMAGE_TAG:-latest}
    container_name: packtok-api
    env_file:
      - ./apps/api/.env.production
    ports:
      # Loopback only — nginx on the host is the public entrypoint (80/443).
      - "127.0.0.1:3001:3001"
    restart: unless-stopped
    # Give the graceful-shutdown handler time to drain connections.
    stop_grace_period: 30s
    # Security: read-only root FS; only /tmp is writable.
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 128M
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/v1/healthcheck').then(r=>{if(!r.ok)throw r.status}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
